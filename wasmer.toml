[package]
name = "ludovibe-backend"
version = "0.1.0"
description = "LudoVibe Laravel API Backend"

[dependencies]
"php/php" = ">=8.3.4"

[fs]
"/app" = "."

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "localhost:8080"]
